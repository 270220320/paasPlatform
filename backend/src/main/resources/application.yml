    extra-http-header-key: ${FH2_EXTRA_HEADER_KEY:}
    extra-http-header-value: ${FH2_EXTRA_HEADER_VALUE:}

  mission:
    dispatch-interval-ms: 30000
    sync-interval-ms: 20000

server:
  port: 8080

logging:
  level:
    com.uavplatform: info
    com.uavplatform.fh2: debug
