spring:
  application:
    name: uav-platform
  datasource:
    # MYSQL_HOST: Windows 本机默认 127.0.0.1；WSL 内跑后端请用 profile=wsl，或导出 MYSQL_HOST=host.docker.internal / 网关 IP
    url: jdbc:mysql://${MYSQL_HOST:127.0.0.1}:3306/UAVPlatform?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:meng1234}
    driver-class-name: com.mysql.cj.jdbc.Driver

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
      id-type: auto

uav:
  jwt:
    secret: UAVPlatformDevSecretKeyMustBeLongEnoughForHS256Algorithm
    expire-seconds: 86400
  # 私有化默认：不展示公有云套餐假上限。若有真实对象存储容量可设 storage-total-bytes
  quota:
    mode: private
    storage-total-bytes: 0
  fh2:
    enabled: true
    # paas.js 在 80 端口；API/WS 在 30812
    front-host: http://192.168.76.141
    server-host: http://192.168.76.141:30812
    gateway-base: http://192.168.76.141:30812/gateway
    wss-url: ws://192.168.76.141:30812/openapi/v0.9/notification/ws/v1/notifications
    # 请填入司空下发的用户 Token 与 binding_uuid（也可用 t_fh2_config 覆盖）；私有化部署无 user token，留空即可
    user-token: ""
    # 私有化无 token 时 binding_uuid/project_uuid 无法从 token 解析，手动指定
    binding-uuid: ""
    # 项目 UUID：媒体 objectKey 首段；Terra/媒体文件夹挂在项目下。私有化请按实际项目填写
    # 例：d96fd7f3-9eb0-4b2c-a546-71d4efd239c1
    project-uuid: ${FH2_PROJECT_UUID:}
    reconstruction-quality-level: high
    reconstruction-wkt: EPSG:32650
    reconstruction-sfm-method: GLOBAL
    reconstruction-vertical-cs: EPSG:5737
    reconstruction-mode: normal
    reconstruction-simplified-factor: 0.8
    # 手动指定媒体文件夹 UUID（与 demo ConfigManager.terraBuildFolderUuid 对齐）；
    # 仅当自动获取不到 folderUuid 时生效。在司空控制台「媒体管理」中找到对应文件夹的 UUID 填入。
    terra-build-folder-uuid: ${FH2_TERRA_FOLDER_UUID:}
    object-key-prefix: ""
    sdk-address: http://192.168.76.141
    sdk-port: "30812"
    sdk-native-enabled: true
    wayline-sdk-css: http://192.168.76.141/paasjs-demo/wayline-edit-sdk/index.css
    wayline-sdk-js: http://192.168.76.141/paasjs-demo/wayline-edit-sdk/index.js
    device-sdk-css: http://192.168.76.141/paasjs-demo/device-manager-sdk-v2/index.css
    device-sdk-js: http://192.168.76.141/paasjs-demo/device-manager-sdk-v2/index.js
    replay-sdk-css: http://192.168.76.141/paasjs-demo/fly-data-sdk/index.css
    replay-sdk-js: http://192.168.76.141/paasjs-demo/fly-data-sdk/index.js
    # 直播大屏（DJILivePlayer）SDK；完全独立、不依赖 paas.js
    live-sdk-css: http://192.168.76.141/paasjs-demo/multi-stream-cdn/sdk/style.css
    live-sdk-js: http://192.168.76.141/paasjs-demo/multi-stream-cdn/sdk/sdk.umd.js
    # dji2 后台（限飞区 /safety、飞行任务 /task|/flighttask）
    route-api-base: http://192.168.76.141:56789
    # 私有化网关鉴权头：网关回调 ISV_WEBHOOK_URL 鉴权，开发期默认 webhook 放行全部，
    # 约定头 user_id: paas_test（鉴权接入指南 2.4）；切换自建 Webhook 时改这两个值
    extra-http-header-key: ${FH2_EXTRA_HEADER_KEY:user_id}
    extra-http-header-value: ${FH2_EXTRA_HEADER_VALUE:paas_test}

  mission:
    dispatch-interval-ms: 30000
    sync-interval-ms: 20000

  # 对话控制模块（本地 Ollama + qwen）。
  # 后端在 WSL/Docker 内时，先在 Windows 设置 OLLAMA_HOST=0.0.0.0 并放行 11434，
  # 再导出 OLLAMA_BASE_URL=http://<宿主机IP>:11434 后启动后端。
  chat:
    enabled: true
    base-url: ${OLLAMA_BASE_URL:http://127.0.0.1:11434}
    # 留空自动选 /api/tags 中第一个含 qwen 的模型（当前：qwen3.5-4b:latest）
    model: ""
    temperature: 0.6
    think-enabled: false
    max-turns: 6
    request-timeout-seconds: 120
    # 1=只读 2=常规控制（生产推荐） 3=含起飞/急停（演示）
    max-security-level: 3
    pending-action-ttl-minutes: 5
    history-window: 20

server:
  port: 8080

logging:
  # 文件见 logback-spring.xml → logs/aiflow-backend.log、logs/aiflow-reconstruct.log
  level:
    com.uavplatform: info
    com.uavplatform.fh2: debug
    aiflow.reconstruct: info
